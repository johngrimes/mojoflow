<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe - <!-- Screen Name --></title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f0f0;
      color: #333;
      line-height: 1.4;
    }
    .wf-container {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wf-header {
      background: #e8e8e8;
      border-bottom: 2px solid #bbb;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .wf-logo {
      font-weight: bold;
      font-size: 1.2rem;
      color: #666;
    }
    .wf-nav {
      display: flex;
      gap: 1.5rem;
    }
    .wf-nav a {
      color: #555;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .wf-nav a:hover { text-decoration: underline; }
    .wf-body {
      display: flex;
      flex: 1;
    }
    .wf-sidebar {
      width: 240px;
      background: #f5f5f5;
      border-right: 2px solid #ddd;
      padding: 1.5rem;
    }
    .wf-sidebar-item {
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.25rem;
      color: #555;
      font-size: 0.9rem;
      border-radius: 4px;
    }
    .wf-sidebar-item.active {
      background: #e0e0e0;
      font-weight: 600;
    }
    .wf-main {
      flex: 1;
      padding: 1.5rem;
    }
    .wf-page-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #444;
    }
    .wf-section {
      margin-bottom: 1.5rem;
    }
    .wf-section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      margin-bottom: 0.75rem;
    }
    .wf-card {
      background: #fafafa;
      border: 2px solid #ccc;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .wf-card-header {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #555;
    }
    .wf-card-body {
      color: #777;
      font-size: 0.9rem;
    }
    .wf-placeholder {
      background: #e0e0e0;
      border: 2px dashed #bbb;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 0.85rem;
      min-height: 120px;
    }
    .wf-button {
      display: inline-block;
      padding: 0.5rem 1rem;
      background: #ddd;
      border: 2px solid #aaa;
      border-radius: 4px;
      color: #555;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
    }
    .wf-button-primary {
      background: #ccc;
      border-color: #888;
      font-weight: 600;
    }
    .wf-form-group {
      margin-bottom: 1rem;
    }
    .wf-label {
      display: block;
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 0.25rem;
    }
    .wf-input {
      width: 100%;
      padding: 0.5rem;
      border: 2px solid #bbb;
      border-radius: 4px;
      background: #fff;
      font-size: 0.9rem;
      color: #777;
    }
    .wf-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .wf-table th, .wf-table td {
      padding: 0.6rem 0.75rem;
      border: 2px solid #ccc;
      text-align: left;
    }
    .wf-table th {
      background: #e8e8e8;
      font-weight: 600;
      color: #555;
    }
    .wf-table td {
      color: #777;
    }
    .wf-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .wf-col { flex: 1; }
    .wf-col-2 { flex: 2; }
    .wf-col-3 { flex: 3; }
    .wf-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wf-modal {
      background: #fff;
      border: 2px solid #999;
      border-radius: 6px;
      width: 90%;
      max-width: 500px;
      padding: 1.5rem;
    }
    .wf-modal-header {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #444;
    }
    .wf-tag {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: #e0e0e0;
      border: 1px solid #bbb;
      border-radius: 3px;
      font-size: 0.75rem;
      color: #666;
      margin-right: 0.5rem;
    }
    .wf-annotation {
      font-size: 0.8rem;
      color: #999;
      font-style: italic;
      margin-top: 0.25rem;
    }
    .wf-footer {
      background: #e8e8e8;
      border-top: 2px solid #bbb;
      padding: 1rem 1.5rem;
      color: #888;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wf-container">
    <!-- Header -->
    <header class="wf-header">
      <div class="wf-logo">App Name</div>
      <nav class="wf-nav">
        <a href="./screen-name.html">Link</a>
      </nav>
    </header>

    <div class="wf-body">
      <!-- Sidebar (optional) -->
      <aside class="wf-sidebar">
        <div class="wf-sidebar-item active">Dashboard</div>
        <div class="wf-sidebar-item">Settings</div>
      </aside>

      <!-- Main Content -->
      <main class="wf-main">
        <h1 class="wf-page-title">Page Title</h1>

        <!-- Example: Two-column layout -->
        <div class="wf-row">
          <div class="wf-col-2">
            <div class="wf-card">
              <div class="wf-card-header">Card Title</div>
              <div class="wf-card-body">Card content description.</div>
            </div>
          </div>
          <div class="wf-col">
            <div class="wf-placeholder">Image / Chart</div>
          </div>
        </div>

        <!-- Example: Form -->
        <div class="wf-section">
          <div class="wf-section-title">Section Title</div>
          <div class="wf-form-group">
            <label class="wf-label">Label</label>
            <input class="wf-input" type="text" value="Placeholder value" readonly>
          </div>
          <a href="./next-screen.html" class="wf-button wf-button-primary">Submit</a>
        </div>

        <!-- Example: Table -->
        <div class="wf-section">
          <table class="wf-table">
            <thead>
              <tr>
                <th>Column A</th>
                <th>Column B</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Data cell</td>
                <td>Data cell</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Footer (optional) -->
    <footer class="wf-footer">
      Footer content
    </footer>
  </div>

  <!-- Example: Modal (optional) -->
  <!--
  <div class="wf-modal-overlay">
    <div class="wf-modal">
      <div class="wf-modal-header">Modal Title</div>
      <p style="color:#777; margin-bottom:1rem;">Modal content goes here.</p>
      <a href="#" class="wf-button">Close</a>
    </div>
  </div>
  -->
</body>
</html>
